---
# Managed only by addons/openshift-delivery/deploy.sh.  Channels are discovered
# from the configured CatalogSource and substituted before apply; do not add a
# customer application, repository, or credential to this file.
apiVersion: v1
kind: Namespace
metadata:
  name: __GITOPS_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: aap-demo
    aap-demo/openshift-delivery: managed
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-demo-openshift-gitops
  namespace: __GITOPS_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: aap-demo
    aap-demo/openshift-delivery: managed
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: aap-demo-openshift-gitops
  namespace: __GITOPS_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: aap-demo
    aap-demo/openshift-delivery: managed
spec:
  channel: __GITOPS_CHANNEL__
  installPlanApproval: Automatic
  name: openshift-gitops-operator
  source: __CATALOG_SOURCE__
  sourceNamespace: __CATALOG_NAMESPACE__
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: aap-demo-openshift-pipelines
  namespace: __PIPELINES_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: aap-demo
    aap-demo/openshift-delivery: managed
spec:
  channel: __PIPELINES_CHANNEL__
  installPlanApproval: Automatic
  name: openshift-pipelines-operator-rh
  source: __CATALOG_SOURCE__
  sourceNamespace: __CATALOG_NAMESPACE__
