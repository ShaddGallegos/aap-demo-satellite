---
- name: Install Satellite demo resources without legacy content setup
  hosts: localhost
  gather_facts: false
  vars_files:
    - satellite/setup.yml
  tasks:
    - name: Snapshot upstream Satellite resources for the local reconciliation
      ansible.builtin.set_fact:
        satellite_lab_controller_credentials: "{{ controller_credentials | default([]) }}"
        satellite_lab_controller_inventories: "{{ controller_inventories | default([]) }}"
        satellite_lab_controller_inventory_sources: "{{ controller_inventory_sources | default([]) }}"
        satellite_lab_controller_workflows: "{{ controller_workflows | default([]) }}"

    - name: Prepare local demo templates without external telemetry notifications
      ansible.builtin.set_fact:
        satellite_lab_templates: >-
          {{ controller_templates | map('combine', {
            'notification_templates_started': [],
            'notification_templates_success': [],
            'notification_templates_error': []
          }) | list }}

    - name: Install Satellite demo resources
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        controller_dependency_check: false
        # The local overlay owns these AAP records because the base installer
        # only creates the APD foundation. Do not update the source before its
        # placeholder Satellite credentials are replaced below.
        controller_credentials: "{{ satellite_lab_controller_credentials }}"
        controller_inventories: "{{ satellite_lab_controller_inventories }}"
        controller_inventory_sources: "{{ satellite_lab_controller_inventory_sources }}"
        controller_templates: "{{ satellite_lab_templates }}"
        controller_workflows: "{{ satellite_lab_controller_workflows }}"
        controller_launch_jobs: []
        aap_configuration_dispatcher_exclude_roles:
          - controller_inventory_source_update
