---
name: PR Checks

# This workflow reads pull-request metadata and the checked-out source only.
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: PR Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR metadata
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (!pr.body) {
              core.setFailed('PR description is required.');
            }
            if (pr.title.length > 72) {
              core.setFailed(`PR title is too long (${pr.title.length} characters, max 72).`);
            }
            const labels = pr.labels.map(label => label.name);
            if (labels.length === 0) {
              core.warning('PR has no labels. Consider adding appropriate labels.');
            }

  size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            let size = 'small';
            if (changes > 1000) {
              size = 'xlarge';
            } else if (changes > 500) {
              size = 'large';
            } else if (changes > 100) {
              size = 'medium';
            }

            core.info(`PR size: ${size} (${changes} changes)`);

            if (changes > 1000) {
              core.warning('This PR is very large. Consider breaking it into smaller PRs.');
            }

  conflict-check:
    name: Merge Conflict Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for merge conflicts
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.mergeable === false) {
              core.setFailed('PR has merge conflicts. Please resolve them.');
            } else if (pr.mergeable === null) {
              core.warning('Merge status is unknown. GitHub may still be calculating.');
            } else {
              core.info('No merge conflicts detected.');
            }

  required-files:
    name: Required Files Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for required files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)"
          git fetch --no-tags origin "$base_ref"
          changed_files="$(git diff --name-only "origin/${base_ref}"...HEAD)"
          # Check if modifying shell scripts
          if grep -q '\.sh$' <<<"$changed_files"; then
            echo "Shell scripts modified, checking for tests..."
            # Could add test file requirements here
          fi

          # Check if modifying docs
          if grep -qE '(includes/|scripts/|addons/)' <<<"$changed_files"; then
            if ! grep -qE '(README\.md|docs/)' <<<"$changed_files"; then
              echo "::warning::Code changes detected but no documentation updates"
            fi
          fi

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new dependencies
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)"
          git fetch --no-tags origin "$base_ref"
          if git diff --name-only "origin/${base_ref}"...HEAD | grep -qE '(requirements|package|Gemfile)'; then
            echo "::notice::Dependency files changed. Ensure dependencies are documented."
          fi
