---
name: Lint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-cli-smoke:
    name: Python dependency and CLI smoke tests
    runs-on: ubuntu-latest
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up tested Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install core Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install declared Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --collections-path "$RUNNER_TEMP/ansible-collections"

      - name: Verify dependency integrity and CLI startup
        run: |
          python -m pip check
          python -c 'import ansible, kubernetes, yaml'
          ansible --version
          ansible-playbook --version
          ansible-vault --version
          ansible-galaxy --version
          ansible-galaxy collection list --collections-path "$RUNNER_TEMP/ansible-collections" > "$RUNNER_TEMP/collections.txt"
          grep -q 'community.general' "$RUNNER_TEMP/collections.txt"
          grep -q 'kubernetes.core' "$RUNNER_TEMP/collections.txt"

      - name: Run isolated credential, Fleet, CLI, and dashboard tests
        run: |
          set -euo pipefail
          bash test/test-credential-vault-migration.sh
          bash test/test-fleet-access.sh
          bash test/test-fleet-stack.sh
          bash test/test-fleet-reconcile.sh
          bash test/test-fleet-aap.sh
          bash test/test-fleet-rhc.sh
          bash test/test-cli-parsing.sh
          bash test/test-bash-completion.sh
          bash test/test-secret-handling.sh
          python test/test-fleet-rhc.py
          python test/test-dashboard.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'
          ignore_paths: '.git .github docs'
          ignore_names: '*.zsh'

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          file_or_dir: .
          strict: false

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint . --config .markdownlint.json --ignore '.claude/**' --ignore '.github/**'

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: |
          pip install ansible-lint

      - name: Run ansible-lint
        run: |
          # Only lint if we have Ansible files
          if [ -f "requirements.yml" ] || find . -name "playbook*.yml" -o -name "site.yml" | grep -q .; then
            ansible-lint --force-color --offline || true
          else
            echo "No Ansible playbooks found, skipping ansible-lint"
          fi
        continue-on-error: true

  secretlint:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          pip install 'detect-secrets==1.5.0'

      - name: Run detect-secrets
        run: ./scripts/check-secrets.sh

  shellformat:
    name: Shell Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          wget -qO /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Run shfmt check
        run: |
          # Find and check all shell scripts
          FILES=$(find . -name '*.sh' ! -path './.venv-lint/*' ! -path './.git/*')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shfmt -d -i 2 -ci -bn
          else
            echo "No shell scripts found"
          fi

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -qO- \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes YAMLs
        run: |
          find config/manifests config/crs -name "*.yaml" -o -name "*.yml" | while read -r file; do
            echo "Validating $file"
            kubeconform -ignore-missing-schemas -summary "$file" || true
          done
        continue-on-error: true

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    if: false  # Enable if Dockerfiles are added
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
